<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Seguridad: solo se ejecuta código de este mismo sitio; nada externo, ningún envío de datos. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1d4ed8">
<title>Inglés Intensivo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg:#f6f7fb; --fg:#14171f; --card:#fff; --muted:#5b6475; --pri:#1d4ed8; --good:#15803d; --bad:#b91c1c; --line:#dde1ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --fg:#eef1f6; --card:#1a1f29; --muted:#9aa4b5; --pri:#5b8cff; --good:#34c46a; --bad:#ff6b6b; --line:#2c3340; } }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; } /* .big y .row ponían display y anulaban "hidden" */
  .hint { text-align:center; color:var(--muted); margin:6px 0 0; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding:14px 16px; background:var(--pri); color:#fff; font-weight:700; font-size:19px; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h2 { font-size:21px; margin:18px 0 10px; }
  button, .btn { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:12px; padding:10px 14px; cursor:pointer; text-decoration:none; display:inline-block; text-align:center; }
  button:active { transform:scale(.98); }
  .big { display:block; width:100%; margin:10px 0; padding:15px; font-size:18px; text-align:left; }
  .big small { float:right; color:var(--muted); }
  .ghost { background:transparent; margin-top:8px; }
  .row { display:flex; gap:8px; margin:10px 0; } .row > * { flex:1; }
  .good { border-color:var(--good) !important; color:var(--good); font-weight:700; }
  .bad { border-color:var(--bad) !important; color:var(--bad); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin:10px 0; }
  .front { font-size:28px; font-weight:700; text-align:center; }
  .back { font-size:22px; text-align:center; color:var(--pri); margin-top:12px; font-weight:600; }
  .ex { font-size:19px; background:var(--card); border-left:4px solid var(--pri); padding:10px 12px; border-radius:8px; }
  .muted { color:var(--muted); }
  .motivo { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; font-weight:600; }
  .stats { display:flex; gap:10px; } .stats div { flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center; }
  .stats b { display:block; font-size:24px; } .stats span { color:var(--muted); font-size:14px; }
  .bar { height:10px; background:var(--line); border-radius:9px; margin:12px 0; overflow:hidden; } .bar i { display:block; height:100%; background:var(--good); }
  input { display:block; margin:8px 0; }
  textarea, input { width:100%; font:inherit; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
  .ok { color:var(--good); font-weight:600; } .miss { color:var(--bad); font-weight:700; text-decoration:underline; }
</style>
</head>
<body>
<header>🇬🇧 Inglés Intensivo</header>
<main id="app"><p>Cargando…</p></main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
